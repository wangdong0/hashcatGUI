[package]
name = "hashcat-gui"
version = "0.1.0"
description = "A polished Windows GUI for hashcat"
authors = ["HashcatGUI"]
edition = "2021"

[lib]
name = "hashcat_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
#thunk-rs = { version = "0.3.5", features = ["win7"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytecount = "0.6"
rand = "0.8"
md5 = "0.7"
hex = "0.4"
zip = { version = "0.6", features = ["deflate"] }
tempfile = "3"
walkdir = "2"
